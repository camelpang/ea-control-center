<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>审计日志 - EA 中央控制系统</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #121a2b;
      --panel-alt: #172036;
      --border: #26324d;
      --text: #e5ecff;
      --muted: #94a3c7;
      --accent: #60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      overflow: hidden;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    h1, h2 {
      margin: 0;
    }

    h1 { font-size: 24px; }
    h2 { font-size: 18px; }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 160px auto auto;
      gap: 10px;
      align-items: end;
    }

    .filter-toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(160px, 0.7fr) minmax(180px, 1fr) auto;
      gap: 10px;
      align-items: end;
      margin-top: 12px;
    }

    .input,
    .select {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: #334155;
      color: var(--text);
      white-space: nowrap;
    }

    .button.primary {
      background: var(--accent);
      color: #081120;
      font-weight: bold;
    }

    .button.ghost {
      background: transparent;
      border: 1px solid var(--border);
    }

    .message {
      display: none;
      margin-top: 10px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .message.show { display: block; }
    .message.ok { background: rgba(22, 163, 74, 0.18); color: #bbf7d0; }
    .message.error { background: rgba(239, 68, 68, 0.18); color: #fecaca; }
    .message.info { background: rgba(96, 165, 250, 0.18); color: #bfdbfe; }

    .log-feed {
      display: grid;
      gap: 10px;
    }

    .log-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: rgba(23, 32, 54, 0.65);
    }

    .log-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .log-title {
      font-weight: bold;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    pre,
    code {
      font-family: Consolas, monospace;
      font-size: 12px;
    }

    pre {
      margin: 8px 0 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .filter-toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="panel">
      <div class="section-title">
        <div>
          <h1>审计日志</h1>
          <div class="meta">记录 EA、用户、分配和命令相关的关键管理动作。</div>
        </div>
        <div class="meta">
          <a href="/admin">中央控制系统</a> ·
          <a href="/commands">命令历史</a> ·
          <a href="/users">用户列表</a>
        </div>
      </div>
      <div class="toolbar">
        <div>
          <label for="adminToken" class="meta">静态 X-Admin-Token（JWT 会优先使用）</label>
          <input id="adminToken" class="input" type="password" placeholder="可留空，优先使用已登录 JWT" />
        </div>
        <div>
          <label for="limitInput" class="meta">条数</label>
          <select id="limitInput" class="select">
            <option value="20">20</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </div>
        <button id="saveTokenBtn" class="button ghost" type="button">保存 Token</button>
        <button id="refreshBtn" class="button primary" type="button">刷新</button>
      </div>
      <div id="pageMessage" class="message"></div>
    </section>

    <section class="panel">
      <div class="section-title">
        <div>
          <h2>筛选</h2>
          <div id="filterSummary" class="meta">显示全部审计日志。</div>
        </div>
      </div>
      <div class="filter-toolbar">
        <div>
          <label for="auditSearchInput" class="meta">关键字</label>
          <input id="auditSearchInput" class="input" type="search" placeholder="EA ID / 命令 ID / 用户 / 详情关键字" />
        </div>
        <div>
          <label for="actionFilter" class="meta">动作类型</label>
          <select id="actionFilter" class="select">
            <option value="all">全部动作</option>
          </select>
        </div>
        <div>
          <label for="actorFilter" class="meta">操作人</label>
          <input id="actorFilter" class="input" type="search" placeholder="例如 admin、system、ea:xxx" />
        </div>
        <button id="exportCsvBtn" class="button" type="button">导出 CSV</button>
        <button id="clearFiltersBtn" class="button ghost" type="button">清空筛选</button>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <div>
          <h2>最近操作</h2>
          <div id="auditLogCount" class="meta">0 条</div>
        </div>
      </div>
      <div id="auditLogFeed" class="log-feed">
        <div class="empty">当前还没有审计日志。</div>
      </div>
    </section>
  </div>

  <script>
    const elements = {
      adminToken: document.getElementById("adminToken"),
      limitInput: document.getElementById("limitInput"),
      pageMessage: document.getElementById("pageMessage"),
      filterSummary: document.getElementById("filterSummary"),
      auditSearchInput: document.getElementById("auditSearchInput"),
      actionFilter: document.getElementById("actionFilter"),
      actorFilter: document.getElementById("actorFilter"),
      exportCsvBtn: document.getElementById("exportCsvBtn"),
      clearFiltersBtn: document.getElementById("clearFiltersBtn"),
      auditLogCount: document.getElementById("auditLogCount"),
      auditLogFeed: document.getElementById("auditLogFeed")
    };

    let allAuditLogs = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
    }

    function prettyJson(value) {
      try {
        return JSON.stringify(value ?? {}, null, 2);
      } catch (_error) {
        return String(value ?? "");
      }
    }

    function getStoredJwt() {
      return (localStorage.getItem("ea-admin-jwt") || "").trim();
    }

    function getToken() {
      return elements.adminToken.value.trim();
    }

    function showMessage(text, type = "info") {
      elements.pageMessage.textContent = text;
      elements.pageMessage.className = `message show ${type}`;
    }

    function clearMessage() {
      elements.pageMessage.className = "message";
      elements.pageMessage.textContent = "";
    }

    function apiErrorMessage(text, statusCode) {
      if (!text) return `请求失败：${statusCode}`;
      try {
        const parsed = JSON.parse(text);
        const detail = parsed.detail;
        if (typeof detail === "string") return detail;
        if (Array.isArray(detail)) {
          return detail.map((item) => {
            const location = Array.isArray(item.loc) ? item.loc.join(".") : "";
            return [location, item.msg].filter(Boolean).join("：");
          }).join("；");
        }
        if (detail) return JSON.stringify(detail);
      } catch {
        // Non-JSON response; show the original text.
      }
      return text;
    }

    async function api(path, options = {}) {
      const jwt = getStoredJwt();
      const legacy = getToken();
      if (!jwt && !legacy) {
        throw new Error("请先在中央控制系统登录，或在本页填写 X-Admin-Token。");
      }
      const headers = { ...options.headers };
      if (jwt) {
        headers.Authorization = "Bearer " + jwt;
      } else {
        headers["X-Admin-Token"] = legacy;
      }
      const response = await fetch(path, { ...options, headers });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(apiErrorMessage(text, response.status));
      }
      return response.json();
    }

    function auditSearchText(row) {
      return [
        row.actor,
        row.actor_role,
        row.action,
        row.resource_type,
        row.resource_id,
        prettyJson(row.details || {}),
      ].join(" ").toLowerCase();
    }

    function filteredAuditLogs() {
      const q = elements.auditSearchInput.value.trim().toLowerCase();
      const action = elements.actionFilter.value;
      const actor = elements.actorFilter.value.trim().toLowerCase();
      return allAuditLogs.filter((row) => {
        if (action !== "all" && row.action !== action) return false;
        if (actor && !String(row.actor || "").toLowerCase().includes(actor)) return false;
        if (q && !auditSearchText(row).includes(q)) return false;
        return true;
      });
    }

    function refreshActionOptions(rows) {
      const current = elements.actionFilter.value;
      const actions = Array.from(new Set(rows.map((row) => row.action).filter(Boolean))).sort();
      elements.actionFilter.innerHTML = '<option value="all">全部动作</option>'
        + actions.map((action) => `<option value="${escapeHtml(action)}">${escapeHtml(action)}</option>`).join("");
      elements.actionFilter.value = actions.includes(current) ? current : "all";
    }

    function renderFilteredAuditLogs() {
      const rows = filteredAuditLogs();
      elements.filterSummary.textContent = `显示 ${rows.length} / ${allAuditLogs.length} 条审计日志。`;
      renderAuditLogs(rows);
    }

    function renderAuditLogs(rows) {
      elements.auditLogCount.textContent = `${rows.length} 条`;
      elements.auditLogFeed.innerHTML = rows.length
        ? rows.map((row) => `
          <div class="log-item">
            <div class="log-head">
              <div>
                <div class="log-title">${escapeHtml(row.action)}</div>
                <div class="meta">${escapeHtml(row.resource_type)}${row.resource_id ? ` · ${escapeHtml(row.resource_id)}` : ""}</div>
              </div>
              <div class="meta">${escapeHtml(formatDate(row.created_at))}</div>
            </div>
            <div class="meta">操作人：${escapeHtml(row.actor)}${row.actor_role ? `（${escapeHtml(row.actor_role)}）` : ""}</div>
            ${row.details ? `<pre>${escapeHtml(prettyJson(row.details))}</pre>` : ""}
          </div>
        `).join("")
        : '<div class="empty">当前还没有审计日志。</div>';
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return `"${text.replaceAll('"', '""')}"`;
    }

    function exportAuditLogsCsv() {
      const rows = filteredAuditLogs();
      if (!rows.length) {
        showMessage("当前筛选结果为空，无需导出。", "info");
        return;
      }
      const header = ["ID", "时间", "操作人", "角色", "动作", "资源类型", "资源ID", "详情"];
      const lines = [
        header.map(csvCell).join(","),
        ...rows.map((row) => [
          row.id,
          row.created_at,
          row.actor,
          row.actor_role,
          row.action,
          row.resource_type,
          row.resource_id,
          prettyJson(row.details || {}),
        ].map(csvCell).join(",")),
      ];
      const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-");
      link.href = url;
      link.download = `audit-logs-${stamp}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showMessage(`已导出 ${rows.length} 条审计日志。`, "ok");
    }

    async function refreshAuditLogs() {
      clearMessage();
      try {
        const limit = encodeURIComponent(elements.limitInput.value);
        allAuditLogs = await api(`/api/admin/audit-logs?limit=${limit}`);
        refreshActionOptions(allAuditLogs);
        renderFilteredAuditLogs();
        showMessage("审计日志已刷新。", "ok");
      } catch (error) {
        showMessage(error.message, "error");
      }
    }

    function clearFilters() {
      elements.auditSearchInput.value = "";
      elements.actionFilter.value = "all";
      elements.actorFilter.value = "";
      renderFilteredAuditLogs();
    }

    function loadPersistedToken() {
      const token = localStorage.getItem("ea-admin-token");
      if (token) elements.adminToken.value = token;
    }

    document.getElementById("saveTokenBtn").addEventListener("click", () => {
      localStorage.setItem("ea-admin-token", getToken());
      showMessage("Token 已保存到当前浏览器。", "ok");
    });
    document.getElementById("refreshBtn").addEventListener("click", refreshAuditLogs);
    elements.limitInput.addEventListener("change", refreshAuditLogs);
    elements.auditSearchInput.addEventListener("input", renderFilteredAuditLogs);
    elements.actionFilter.addEventListener("change", renderFilteredAuditLogs);
    elements.actorFilter.addEventListener("input", renderFilteredAuditLogs);
    elements.exportCsvBtn.addEventListener("click", exportAuditLogsCsv);
    elements.clearFiltersBtn.addEventListener("click", clearFilters);

    loadPersistedToken();
    refreshAuditLogs();
  </script>
</body>
</html>
